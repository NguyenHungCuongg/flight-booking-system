services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: flightbooking
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql # postgres:18 lưu dữ liệu ở /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flightbooking
      MAIL_HOST: mailpit
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agent:
    build: ./agent
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      BACKEND_URL: http://backend:8080
      AGENT_DB_PATH: /data/chats.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - ./frontend/content/chinh-sach:/app/frontend/content/chinh-sach:ro
      - agentdata:/data
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "uv", "run", "--no-dev", "--no-sync", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgdata:
  agentdata:
