  sh.moveTo(-0.6, 1.95); sh.quadraticCurveTo(-2.4, 2.22, -4.7, 2.5); sh.lineTo(-8.6, 1.78);
  sh.quadraticCurveTo(-8.7, 1.3, -7.6, 1.2); sh.lineTo(-6.0, 1.14); sh.lineTo(-4.9, 1.5); sh.lineTo(-0.6, 1.85); sh.closePath();
  const pg = new THREE.ExtrudeGeometry(sh, { depth: 0.34, bevelEnabled: true, bevelThickness: 0.09, bevelSize: 0.07, bevelSegments: 5, curveSegments: 16 });
  pg.translate(0, 0, -0.17);
  grp.add(new THREE.Mesh(pg, white));
  grp.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return grp;
}

/* ---------- Assemble aircraft ---------- */
function aircraft() {
  const ac = new THREE.Group();
  const fusMat = paint(0xf4f6f8, 0.28); fusMat.map = fuselageTexture();
  const fus = new THREE.Mesh(fuselageGeometry(), fusMat);
  ac.add(fus);
  const wingMat = paint(0xe9ecef, 0.36); wingMat.vertexColors = true;
  const wg = loft(wingStations(), { n: 44, leBand: 0.03 });
  ac.add(new THREE.Mesh(wg, wingMat));
  ac.add(new THREE.Mesh(mirrorZ(wg), wingMat));
  const tailMat = paint(0xf2f4f6, 0.3); tailMat.vertexColors = true;
  const hg = loft(hStations(), { n: 32, leBand: 0.03 });
  ac.add(new THREE.Mesh(hg, tailMat));
  ac.add(new THREE.Mesh(mirrorZ(hg), tailMat));
  const finMat = paint(0xf4f6f8, 0.28); finMat.vertexColors = true;
  ac.add(new THREE.Mesh(loft(vStations(), { n: 32, leBand: 0.025 }), finMat));
  // belly fairing

  // engines
  for (const side of [1, -1]) {
    const e = engine();
    const z = 9.6 * side;
    e.position.set(5.5, -2.5, z);
    e.rotation.z = 2.2 * D;
    ac.add(e);
  }
  // flap track fairings
  const ftfMat = paint(0xe9ecef, 0.36);
  for (const side of [1, -1]) for (const z of [4.6, 13.6, 18.4, 23.2]) {
    const r = interpTable(wingTable, z);
    const f = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 20), ftfMat);
    const len = r.c * 0.3 + 0.9;
    f.scale.set(len, 0.27, 0.24);
    f.position.set(r.x - r.c * 0.8, wingY(z) - 0.26, z * side);
    f.rotation.z = 3 * D;
    ac.add(f);
  }
  ac.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return ac;
}

const plane = aircraft();
const pivot = new THREE.Group();
pivot.add(plane);
scene.add(pivot);

/* ---------- Views ---------- */
const views = {
  hero:   { yaw: -38, pitch: 7, roll: 13, cam: [0, 26, 150], target: [0, 1.0, 0], fov: 30, sun: [-60, 90, 70] },
  tail:   { yaw: 24, pitch: 2, roll: 0, cam: [-62, 16, 70], target: [-21, 6, 0], fov: 15, sun: [-20, 80, 90], frame: 'tail' },
  engine: { yaw: -58, pitch: 4, roll: 6, cam: [0, -3, 60], target: [2.0, -1.5, 9.2], fov: 26, sun: [-50, 70, 80], frame: 'engine' },
  depart: { yaw: 152, pitch: 14, roll: -10, cam: [0, -10, 150], target: [0, 1.5, 0], fov: 28, sun: [-40, 90, -30] },
  side:   { yaw: 0, pitch: 0, roll: 0, cam: [0, 4, 160], target: [0, 1, 0], fov: 28, sun: [-40, 80, 80] },
  top:    { yaw: 0, pitch: 0, roll: 0, cam: [0, 170, 0.01], target: [0, 0, 0], fov: 28, sun: [-40, 120, 40] },
};
const V = views[VIEW] || views.hero;
const num = (k, d) => (q.has(k) ? +q.get(k) : d);
pivot.rotation.order = 'YZX';
pivot.rotation.set(num('roll', V.roll) * D, num('yaw', V.yaw) * D, num('pitch', V.pitch) * D);
const cam = new THREE.PerspectiveCamera(num('fov', V.fov), W / H, 0.5, 3000);
const cp = q.has('cam') ? q.get('cam').split(',').map(Number) : V.cam;
const tp = q.has('tgt') ? q.get('tgt').split(',').map(Number) : V.target;
cam.position.set(...cp);
// target is given in aircraft-local coordinates for close-ups
pivot.updateMatrixWorld(true);
const tgt = new THREE.Vector3(...tp);
if (V.frame) plane.localToWorld(tgt);
cam.lookAt(tgt);
const sp = q.has('sun') ? q.get('sun').split(',').map(Number) : V.sun;
sun.position.set(...sp); sun.target.position.set(0, 0, 0);

// auto-fit full-aircraft views: keep camera direction, centre the silhouette and fill a fraction of the frame
const FILL = num('fill', V.frame ? 0 : 0.9);
if (FILL > 0) {
  const pts = [];
  plane.traverse((o) => {
    if (!o.isMesh) return;
    const p = o.geometry.attributes.position; const step = Math.max(1, Math.floor(p.count / 1500));
    for (let i = 0; i < p.count; i += step) pts.push(new THREE.Vector3(p.getX(i), p.getY(i), p.getZ(i)).applyMatrix4(o.matrixWorld));
  });
  const dir = new THREE.Vector3().subVectors(cam.position, tgt).normalize();
  let dist = cam.position.distanceTo(tgt);
  const center = tgt.clone();
  for (let it = 0; it < 6; it++) {
    cam.position.copy(center).addScaledVector(dir, dist); cam.lookAt(center); cam.updateMatrixWorld(true);
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const v of pts) { const s = v.clone().project(cam); minX = Math.min(minX, s.x); maxX = Math.max(maxX, s.x); minY = Math.min(minY, s.y); maxY = Math.max(maxY, s.y); }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    // shift centre in camera plane
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    const h = Math.tan(cam.fov * D / 2) * dist;
    center.addScaledVector(right, cx * h * cam.aspect).addScaledVector(up, cy * h);
    const ext = Math.max((maxX - minX) / 2, (maxY - minY) / 2);
    dist *= ext / FILL;
  }
  cam.position.copy(center).addScaledVector(dir, dist); cam.lookAt(center);
}

renderer.render(scene, cam);
window.__done = true;
</script>
