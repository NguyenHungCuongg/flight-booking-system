spring.application.name=flightbooking

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Đăng nhập do identity tự làm (Plan 02), không cần user sinh sẵn của Spring Boot.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
# Jakarta Mail mặc định chờ vô hạn; SMTP treo sẽ giữ thread async và connection DB của listener.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# Dùng STARTTLS nếu server hỗ trợ (SMTP thật cổng 587 cần); Mailpit không có TLS vẫn gửi bình thường.
spring.mail.properties.mail.smtp.starttls.enable=true
# Gửi email lỗi chỉ ghi log (FR-130), nên SMTP tắt không được làm /actuator/health báo DOWN.
management.health.mail.enabled=false
app.mail-from=${MAIL_FROM:no-reply@flightbooking.local}
app.base-url=${APP_BASE_URL:http://localhost:3000}
# VNPay sandbox (TDD §6.3, §10.1). Mã và secret nằm trong .env; thiếu secret thì app vẫn chạy, chỉ thanh toán báo lỗi.
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/api/payments/vnpay/return}
